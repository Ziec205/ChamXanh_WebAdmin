name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BE — API NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: BE/package-lock.json
      - run: npm ci
      - name: Kiểm kiểu dữ liệu
        run: npm run typecheck
      - name: Kiểm thử đơn vị
        run: npm test
      - name: Kiểm thử đầu cuối
        run: npm run test:e2e
      - name: Dựng bản build
        run: npm run build

  frontend:
    name: FE — Web Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - name: Kiểm kiểu dữ liệu
        run: npm run typecheck
      - name: Kiểm lỗi cú pháp
        run: npm run lint
      - name: Dựng bản build
        run: npm run build
        env:
          API_URL: http://localhost:3001/api/v1
